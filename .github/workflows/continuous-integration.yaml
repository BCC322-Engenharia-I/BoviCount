name: Continuous Integration

on: [pull_request, push]

jobs:
    continuous-integration:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v3

            # instala gcc, g++ e o make
            - name: install c++ dependecies
              run: |
                sudo apt-get update
                sudo apt-get install -y build-essential

            # compila a aplicacao
            - name: build
              run: make compile

            # compila e roda os testes do pasto
            - name: test pasto
              run: |
                make compile-test-pasto
                make run-test-pasto